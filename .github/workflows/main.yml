on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          cache: npm
          node-version-file: package.json
      - run: npm ci
      - run: npm run lint

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          cache: npm
          node-version-file: package.json
      - run: npm ci
      - run: npm run build
      - id: get-version
        run: echo "plugin-version=$(jq -r '.version' manifest.json)" >> "$GITHUB_OUTPUT"
      - run: |
          tar -czf "Claude.md Theme Companion_${{ steps.get-version.outputs.plugin-version }}.tar.gz" -C dist main.js manifest.json styles.css
      - uses: actions/upload-artifact@v7
        with:
          path: Claude.md Theme Companion_${{ steps.get-version.outputs.plugin-version }}.tar.gz
          archive: false
          if-no-files-found: error

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          cache: npm
          node-version-file: package.json
      - run: npm ci
      - run: npm run test:coverage
