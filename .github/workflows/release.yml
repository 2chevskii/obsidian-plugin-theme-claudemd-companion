on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          cache: npm
          node-version-file: package.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      - id: get-version
        run: |
          manifest_version=$(jq -r '.version' manifest.json)
          package_version=$(jq -r '.version' package.json)
          if [[ "$manifest_version" != "$package_version" ]]; then
            echo "Manifest version '$manifest_version' must match package version '$package_version'." >&2
            exit 1
          fi
          if [[ "$manifest_version" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag '$GITHUB_REF_NAME' must match manifest version '$manifest_version'." >&2
            exit 1
          fi
          echo "plugin-version=$manifest_version" >> "$GITHUB_OUTPUT"
      - uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.get-version.outputs.plugin-version }}" \
            --title "Claude.md Theme Companion ${{ steps.get-version.outputs.plugin-version }}" \
            --generate-notes \
            main.js \
            manifest.json \
            styles.css
